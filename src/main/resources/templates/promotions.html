<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promotions | HEI Graduate Manager</title>
    <link rel="stylesheet" th:href="@{/css/hei-theme.css}" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">HEI Graduate Manager</div>
      </header>

      <main class="card">
        <div class="header-row">
          <div>
            <p class="eyebrow">Academic overview</p>
            <h1>Promotions</h1>
          </div>
          <div class="count-chip">
            <span th:text="${#lists.size(promotions)}">0</span>
            total
          </div>
        </div>

        <div th:if="${#lists.isEmpty(promotions)}" class="empty-state">
          <h2>No promotions available</h2>
          <p>There are currently no promotions to display.</p>
        </div>

        <div th:unless="${#lists.isEmpty(promotions)}" class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Year</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="promotion : ${promotions}">
                <td>
                  <a
                    class="promotion-link"
                    th:href="@{/promotions/{id}(id=${promotion.id})}"
                    th:text="${promotion.year}"
                  >
                    2026
                  </a>
                </td>
                <td>
                  <div class="actions">
                    <a
                      class="btn btn-primary"
                      th:href="@{/promotions/{id}(id=${promotion.id})}"
                    >
                      View details
                    </a>
                    <a
                      class="btn btn-secondary"
                      th:href="@{/api/promotions/{id}/graduates/export(id=${promotion.id})}"
                    >
                      Export Excel
                    </a>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </body>
</html>
